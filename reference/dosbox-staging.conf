# DOSBox Staging config for the original SWOTL 2.2 under the ignored ref/.
# Run from the repository root:
#   dosbox-staging -conf reference/dosbox-staging.conf

[sdl]
fullscreen = off

[render]
aspect = auto
shader = crt-auto

[dosbox]
memsize = 4

[cpu]
# A fast 386/486 level. Adjust in game with Ctrl+F11 / Ctrl+F12.
core = auto
cputype = auto
cpu_cycles = 12000

[mouse]
mouse_capture = onclick

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
oplmode = auto

[joystick]
joysticktype = auto
timed = on

[autoexec]
mount c "ref"
c:
call sw.bat
exit
