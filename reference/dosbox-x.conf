# DOSBox-X config for scripted, instrumented SWOTL reference runs.
# Used by tools/pc_run.py; CPU type is chosen per run (open-work: CPU
# personality).

[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = svga_s3
memsize = 4

[cpu]
core = normal
cputype = 386
cycles = fixed 12000

[mixer]
nosound = true

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
oplmode = auto

[log]
logfile = dosbox-x.log
